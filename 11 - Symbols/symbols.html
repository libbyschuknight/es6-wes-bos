<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Symbols</title>
</head>
<body>
<script>
  const wes = Symbol('Wes');
  const person = Symbol('Wes');

  const classRoom = {
    [Symbol('Mark')] : { grade: 50, gender: 'male' },
    [Symbol('olivia')]: { grade: 80, gender: 'female' },
    [Symbol('olivia')]: { grade: 80, gender: 'female' },
  };

  for (const person in classRoom) {
    console.log(person);
  }

  const syms = Object.getOwnPropertySymbols(classRoom);
  const data = syms.map(sym => classRoom[sym]);
  console.log(data);

</script>
</body>
</html>


<!--
primitive types in JS
how many - 7

https://developer.mozilla.org/en-US/docs/Glossary/Primitive

another one - symbol
unique identifiers
used to create unique identifiers for object properties
not enumerable in for...in loops
retrieved using Object.getOwnPropertySymbols()

avoid having naming collisions

-->
