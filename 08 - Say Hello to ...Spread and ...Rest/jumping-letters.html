<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>The ...Spread Operator</title>
  <style>
    body {
      min-height: 100vh;
      font-family: sans-serif;
      background: #ffc600;
      text-transform: uppercase;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 50px;
      color: white;
      text-shadow: 3px 3px 0 rgba(0, 0, 0, 0.2);
    }

    .jump span {
      display: inline-block;
      transition: transform 0.2s;
      cursor: url('https://csscursor.info/santahand.fbeeee9f.png'), default;
    }

    .jump span:hover {
      transform: translateY(-20px) rotate(10deg) scale(2);
    }
  </style>
</head>

<body>
  <h2 class="jump">SPREADS!</h2>

  <script>
    // with some help from autocomplete gemini

    const heading = document.querySelector('.jump');

    // get word out of heading
    text = heading.textContent;

    // spread into array of strings
    textArray = [...text];

    // map it to use animation
    textArray = textArray.map(letter => `<span>${letter}</span>`);

    // put text array back into DOM
    heading.innerHTML = textArray.join('');

    // WES BOS
    // const heading = document.querySelector('.jump');
    // heading.innerHTML = sparanWrap(heading.textContent);

    // function sparanWrap(word) {
    //   return [...word].map(letter => `<span>${letter}</span>`).join('');
    // }

  </script>
</body>

</html>
